# OpenTelemetry Collector
#
# Apps and RUM always export HERE (OTLP). Swap observability backends by
# changing exporter env vars / which exporter is enabled in pipelines —
# no application code changes required.
#
# Default backend exporter: otlphttp/backend (OTLP/HTTP)
# Alternate (commented):     otlp/backend     (OTLP/gRPC)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:5173"
            - "http://127.0.0.1:5173"
            - "http://localhost:3000"
            - "http://127.0.0.1:3000"
            - "*"

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 400
    spike_limit_mib: 100

  resource:
    attributes:
      - key: deployment.environment
        value: demo
        action: upsert
      - key: lab.stack
        value: otel-microservices
        action: upsert

  transform/peer_service:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["peer.service"], "stripe") where IsMatch(attributes["server.address"], "(?i).*stripe\\.com.*") or IsMatch(attributes["url.full"], "(?i).*stripe\\.com.*") or IsMatch(attributes["http.url"], "(?i).*stripe\\.com.*")
          - set(attributes["peer.service"], "open-meteo") where IsMatch(attributes["server.address"], "(?i).*open-meteo\\.com.*") or IsMatch(attributes["url.full"], "(?i).*open-meteo\\.com.*") or IsMatch(attributes["http.url"], "(?i).*open-meteo\\.com.*")
          - set(attributes["peer.service"], "jsonplaceholder") where IsMatch(attributes["server.address"], "(?i).*jsonplaceholder.*") or IsMatch(attributes["url.full"], "(?i).*jsonplaceholder.*") or IsMatch(attributes["http.url"], "(?i).*jsonplaceholder.*")
          - set(attributes["dependency.type"], "third_party") where attributes["peer.service"] != nil

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # -------------------------------------------------------------------------
  # OTLP/HTTP — default. Works with OpenObserve, Grafana Cloud, Honeycomb,
  # Elastic, self-hosted Tempo/OTel backends that accept OTLP/HTTP.
  #
  # Examples:
  #   OpenObserve:  https://api.openobserve.ai/api/<org>
  #                 Authorization=Basic <token>
  #                 (optional) organization / stream-name headers below
  #   Grafana Cloud: https://otlp-gateway-prod-xxx.grafana.net/otlp
  #                 Authorization=Basic <instance:token>
  #   Honeycomb:     https://api.honeycomb.io
  #                 x-honeycomb-team=<api-key>  (add under headers)
  # -------------------------------------------------------------------------
  otlphttp/backend:
    endpoint: ${env:OTEL_BACKEND_OTLP_HTTP_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_BACKEND_AUTHORIZATION}
      # OpenObserve-specific (harmless empty for most other backends if unused)
      organization: ${env:OTEL_BACKEND_HEADER_ORGANIZATION}
      stream-name: ${env:OTEL_BACKEND_HEADER_STREAM}
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s

  # -------------------------------------------------------------------------
  # OTLP/gRPC — enable for backends that prefer gRPC (Tempo, Jaeger OTLP,
  # another Collector, etc.). To use:
  #   1) Set OTEL_BACKEND_OTLP_GRPC_ENDPOINT (host:port, no https://)
  #   2) In pipelines below, replace otlphttp/backend with otlp/backend
  # -------------------------------------------------------------------------
  # otlp/backend:
  #   endpoint: ${env:OTEL_BACKEND_OTLP_GRPC_ENDPOINT}
  #   headers:
  #     Authorization: ${env:OTEL_BACKEND_AUTHORIZATION}
  #   tls:
  #     insecure: ${env:OTEL_BACKEND_OTLP_GRPC_TLS_INSECURE}
  #   compression: gzip
  #   timeout: 30s
  #   retry_on_failure:
  #     enabled: true

  # Local debug sink — always useful while wiring a new backend
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/peer_service, batch]
      # Swap otlphttp/backend ↔ otlp/backend when changing transport
      exporters: [otlphttp/backend, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/backend, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/backend, debug]
