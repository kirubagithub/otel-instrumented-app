server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin OTLP proxy so browser RUM avoids CORS / blocked localhost:4318 issues
  location /otlp/ {
    proxy_pass http://otel-collector:4318/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 5m;

    # Preflight for OTLP/HTTP from the browser
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods "POST, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, traceparent, tracestate";
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
  }

  location / {
    try_files $uri /index.html;
  }
}
