# Shared OTLP settings for all app services (HTTP → local collector).
# Override host/ports in .env if needed; internal collector ports stay 4317/4318.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://${OTEL_COLLECTOR_HOST:-otel-collector}:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=otel-demo,service.version=1.0.0
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: otel
      POSTGRES_DB: otel_demo
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otel -d otel_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: otel
      RABBITMQ_DEFAULT_PASS: otel
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  flagd:
    image: ghcr.io/open-feature/flagd:v0.11.4
    command: ["start", "--uri", "file:/etc/flagd/chaos.flagd.json"]
    ports:
      - "8013:8013"
      - "8014:8014"
    volumes:
      - ./flags:/etc/flagd

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      OTEL_BACKEND_OTLP_HTTP_ENDPOINT: ${OTEL_BACKEND_OTLP_HTTP_ENDPOINT:-https://api.openobserve.ai/api/default}
      OTEL_BACKEND_AUTHORIZATION: ${OTEL_BACKEND_AUTHORIZATION:-Basic REPLACE_ME}
      OTEL_BACKEND_HEADER_ORGANIZATION: ${OTEL_BACKEND_HEADER_ORGANIZATION:-default}
      OTEL_BACKEND_HEADER_STREAM: ${OTEL_BACKEND_HEADER_STREAM:-default}
      OTEL_BACKEND_OTLP_GRPC_ENDPOINT: ${OTEL_BACKEND_OTLP_GRPC_ENDPOINT:-localhost:4317}
      OTEL_BACKEND_OTLP_GRPC_TLS_INSECURE: ${OTEL_BACKEND_OTLP_GRPC_TLS_INSECURE:-true}
    ports:
      # Host port → fixed internal 4317/4318 (simple mapping)
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "13133:13133"
    # Contrib image is minimal (no wget/curl). Process readiness is enough;
    # apps retry OTLP export if the collector is still starting.
    # Manual check: curl http://localhost:13133  (or your mapped host)

  catalog:
    build: ./services/catalog
    environment:
      <<: *otel-env
      SERVER_PORT: "8082"
      DATABASE_URL: jdbc:postgresql://postgres:5432/otel_demo
      DATABASE_USER: otel
      DATABASE_PASSWORD: otel
      OTEL_SERVICE_NAME: catalog-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  orders:
    build: ./services/orders
    environment:
      <<: *otel-env
      PORT: "8081"
      DATABASE_URL: postgresql://otel:otel@postgres:5432/otel_demo
      RABBITMQ_URL: amqp://otel:otel@rabbitmq:5672/
      CATALOG_URL: http://catalog:8082
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      FLAGD_HOST: flagd
      FLAGD_PORT: "8013"
      OTEL_SERVICE_NAME: orders-service
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started
      flagd:
        condition: service_started
      otel-collector:
        condition: service_started

  worker:
    build: ./services/worker
    restart: unless-stopped
    environment:
      <<: *otel-env
      RABBITMQ_URL: amqp://otel:otel@rabbitmq:5672/
      DATABASE_URL: postgres://otel:otel@postgres:5432/otel_demo?sslmode=disable
      FLAGD_HOST: flagd
      FLAGD_PORT: "8013"
      HEALTH_PORT: "8083"
      OTEL_SERVICE_NAME: worker-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      flagd:
        condition: service_started
      otel-collector:
        condition: service_started

  bff:
    build: ./services/bff
    restart: unless-stopped
    environment:
      <<: *otel-env
      PORT: "3000"
      ORDERS_URL: http://orders:8081
      CATALOG_URL: http://catalog:8082
      FLAGD_HOST: flagd
      FLAGD_PORT: "8013"
      FLAGD_FILE: /etc/flagd/chaos.flagd.json
      OTEL_SERVICE_NAME: bff-service
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os
    ports:
      - "3000:3000"
    volumes:
      - ./flags:/etc/flagd
    depends_on:
      orders:
        condition: service_started
      catalog:
        condition: service_started
      flagd:
        condition: service_started
      otel-collector:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:3000}
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-/otlp}
    ports:
      - "5173:80"
    depends_on:
      - bff
      - otel-collector

  locust:
    profiles: ["loadgen"]
    build: ./loadgen
    environment:
      CHAOS_INTERMITTENT: ${CHAOS_INTERMITTENT:-true}
    ports:
      - "8089:8089"
    depends_on:
      - bff
    command: ["locust", "-f", "locustfile.py", "--host", "http://bff:3000"]

volumes:
  pgdata:
